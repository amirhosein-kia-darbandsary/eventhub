[project]
name = "eventhub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cryptography>=49.0.0",
    "dramatiq[redis]>=2.2.0",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "periodiq>=0.14.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: تست‌های سریع و بدون I/O -- بدون دیتابیس، بدون شبکه",
    "integration: تست‌هایی که به یک دیتابیس تست واقعی وصل می‌شن",
]

[tool.coverage.run]
source = ["app/services"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
